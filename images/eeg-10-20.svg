<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- =================================================================
       Système international 10-20 (EEG), façon planche de manuscrit.
       Tout est dessiné en SVG : du texte, donc léger (~5 Ko) et net à
       toutes les tailles. Les effets "vieux papier" viennent de filtres.
       Tête : centre (200,200), rayon 140. Anneau des électrodes : rayon 112.
       ================================================================= -->
  <defs>
    <!-- ENCRE : un bruit (feTurbulence) sert à DÉFORMER légèrement les traits
         (feDisplacementMap) → lignes qui tremblent comme à la plume. -->
    <filter id="encre" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="2" seed="3" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- TACHES DU PAPIER : un bruit large transformé en taches brunes semi-transparentes -->
    <filter id="taches">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.45
                             0 0 0 0 0.31
                             0 0 0 0 0.16
                             0.9 0 0 0 -0.38"/>
    </filter>

    <!-- Bords assombris, comme une page jaunie -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#5a3c1e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3c1e" stop-opacity="0.45"/>
    </radialGradient>

    <style>
      .trait   { fill: none; stroke: #3a2716; stroke-linecap: round; }
      .guide   { fill: none; stroke: #3a2716; stroke-width: 0.8; stroke-dasharray: 3 4; opacity: 0.7; }
      .el      { fill: #efe3c6; stroke: #3a2716; stroke-width: 1.3; }
      text     { fill: #3a2716; font-family: 'IM Fell English', 'EB Garamond', Georgia, serif; font-style: italic; }
      .nom     { font-size: 9.5px; font-style: normal; text-anchor: middle; dominant-baseline: central; }
      .note    { font-size: 7.5px; opacity: 0.75; }
      .repere  { font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <!-- ===== Le parchemin ===== -->
  <rect width="400" height="400" fill="#e8d9b8"/>
  <rect width="400" height="400" filter="url(#taches)" opacity="0.5"/>
  <rect width="400" height="400" fill="url(#vignette)"/>

  <!-- ===== Tout le dessin passe par le filtre "encre" ===== -->
  <g filter="url(#encre)">

    <!-- Légendes de planche -->
    <text x="22" y="34" font-size="17">Fig. I.</text>
    <text x="378" y="34" font-size="12" text-anchor="end">Syſtema X–XX</text>

    <!-- Tête, nez, oreilles -->
    <circle class="trait" cx="200" cy="200" r="140" stroke-width="1.8"/>
    <path class="trait" stroke-width="1.6" d="M 184 62 L 200 40 L 216 62"/>
    <path class="trait" stroke-width="1.6" d="M 61 178 C 44 182, 44 218, 61 222"/>
    <path class="trait" stroke-width="1.6" d="M 339 178 C 356 182, 356 218, 339 222"/>

    <!-- Repères anatomiques -->
    <text class="repere" x="200" y="28">Nasion</text>
    <text class="repere" x="200" y="372">Inion</text>

    <!-- Lignes de construction : anneau, axes, arcs frontal et pariétal -->
    <circle class="guide" cx="200" cy="200" r="112"/>
    <line class="guide" x1="200" y1="60" x2="200" y2="340"/>
    <line class="guide" x1="60" y1="200" x2="340" y2="200"/>
    <path class="guide" d="M 109.5 134.2 A 423.1 423.1 0 0 0 290.5 134.2"/>
    <path class="guide" d="M 109.5 265.8 A 423.1 423.1 0 0 1 290.5 265.8"/>

    <!-- Les fameux 10 % / 20 % le long de la ligne médiane -->
    <text class="note" x="205" y="78">10 %</text>
    <text class="note" x="205" y="120">20 %</text>
    <text class="note" x="205" y="176">20 %</text>
    <text class="note" x="205" y="232">20 %</text>
    <text class="note" x="205" y="288">20 %</text>
    <text class="note" x="205" y="330">10 %</text>

    <!-- Électrodes : impair = gauche, pair = droite, z = ligne médiane -->
    <g>
      <circle class="el" cx="165.4" cy="93.5" r="11"/><text class="nom" x="165.4" y="93.5">Fp1</text>
      <circle class="el" cx="234.6" cy="93.5" r="11"/><text class="nom" x="234.6" y="93.5">Fp2</text>

      <circle class="el" cx="109.5" cy="134.2" r="11"/><text class="nom" x="109.5" y="134.2">F7</text>
      <circle class="el" cx="154.7" cy="141.6" r="11"/><text class="nom" x="154.7" y="141.6">F3</text>
      <circle class="el" cx="200" cy="144" r="11"/><text class="nom" x="200" y="144">Fz</text>
      <circle class="el" cx="245.3" cy="141.6" r="11"/><text class="nom" x="245.3" y="141.6">F4</text>
      <circle class="el" cx="290.5" cy="134.2" r="11"/><text class="nom" x="290.5" y="134.2">F8</text>

      <circle class="el" cx="40" cy="200" r="11"/><text class="nom" x="40" y="200">A1</text>
      <circle class="el" cx="88" cy="200" r="11"/><text class="nom" x="88" y="200">T7</text>
      <circle class="el" cx="144" cy="200" r="11"/><text class="nom" x="144" y="200">C3</text>
      <circle class="el" cx="200" cy="200" r="11"/><text class="nom" x="200" y="200">Cz</text>
      <circle class="el" cx="256" cy="200" r="11"/><text class="nom" x="256" y="200">C4</text>
      <circle class="el" cx="312" cy="200" r="11"/><text class="nom" x="312" y="200">T8</text>
      <circle class="el" cx="360" cy="200" r="11"/><text class="nom" x="360" y="200">A2</text>

      <circle class="el" cx="109.5" cy="265.8" r="11"/><text class="nom" x="109.5" y="265.8">P7</text>
      <circle class="el" cx="154.7" cy="258.4" r="11"/><text class="nom" x="154.7" y="258.4">P3</text>
      <circle class="el" cx="200" cy="256" r="11"/><text class="nom" x="200" y="256">Pz</text>
      <circle class="el" cx="245.3" cy="258.4" r="11"/><text class="nom" x="245.3" y="258.4">P4</text>
      <circle class="el" cx="290.5" cy="265.8" r="11"/><text class="nom" x="290.5" y="265.8">P8</text>

      <circle class="el" cx="165.4" cy="306.5" r="11"/><text class="nom" x="165.4" y="306.5">O1</text>
      <circle class="el" cx="234.6" cy="306.5" r="11"/><text class="nom" x="234.6" y="306.5">O2</text>
    </g>

    <!-- Une goutte d'encre tombée de la plume -->
    <circle cx="352" cy="352" r="4.5" fill="#3a2716" opacity="0.8"/>
    <circle cx="362" cy="346" r="1.6" fill="#3a2716" opacity="0.7"/>
  </g>
</svg>
