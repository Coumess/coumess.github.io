<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="L'Almanach : une frise chronologique interactive, des rois de France et d'Angleterre aux curiosités de l'histoire.">
    <title>L'Almanach · Alexandre Coumes</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Grenze+Gotisch:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/almanach.css">
</head>

<body>
    <!-- Même bannière et même barre que l'accueil (copiées : pas d'"include" en HTML pur) -->
    <header class="tranche">
        <a href="hiddenplaces.html" class="livre-secret" id="derobade" aria-label="La dérobade"></a>
        <a href="lol.html" class="livre-secret" id="livre-lol" aria-label="Le grimoire de la Faille"></a>
    </header>

    <nav class="header">
        <a href="index.html" class="logo" aria-label="Coumess, accueil"><span class="lettrine" aria-hidden="true"></span>oumess</a>
        <ul class="nav-links">
            <!-- index.html#projets : aller sur l'accueil PUIS défiler jusqu'à #projets -->
            <li><a href="index.html#projets">Projets</a></li>
            <li><a href="index.html#chroniques">Chroniques</a></li>
            <li><a href="index.html#publications">Publications</a></li>
            <!-- aria-current="page" : "tu es ici", annoncé aux lecteurs d'écran et stylé en or -->
            <li><a href="almanach.html" aria-current="page">Almanach</a></li>
        </ul>
    </nav>

    <main class="almanach">
        <h1>L'Almanach</h1>
        <p class="intro">
            Molette pour zoomer, glisser pour voyager dans le temps.
            Les rois apparaissent en zoomant ; la bande verte, c'est ma vie.
        </p>

        <!-- Une vraie case à cocher : clavier (Espace), lecteur d'écran et clic
             sur le texte fonctionnent tout seuls grâce au <label> qui l'entoure. -->
        <label class="option">
            <input type="checkbox" id="afficher-couronnes" checked>
            Afficher les couronnes de France et d'Angleterre
        </label>

        <div id="visualization"></div>

        <!-- hidden : caché tant qu'aucun événement n'est sélectionné.
             aria-live="polite" : le lecteur d'écran lit le contenu quand il change. -->
        <section id="event-details" aria-live="polite" hidden></section>
    </main>

    <!-- type="module" : permet import et await. Un module attend que le HTML soit lu
         avant de s'exécuter, donc plus besoin de DOMContentLoaded. -->
    <script src="js/almanach.js" type="module"></script>
</body>
</html>
